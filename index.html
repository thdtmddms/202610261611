<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFPK Life-Cycle FinPlan v6.0 | 디지털 WM 자산관리 센터</title>
    <!-- Pretendard 한글 웹폰트 & FontAwesome 아이콘 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #f4f6f9;
            color: #1e293b;
        }
        .bank-gradient {
            background: linear-gradient(135deg, #0a192f 0%, #112240 55%, #1e3a8a 100%);
        }
        .gold-badge {
            background: linear-gradient(90deg, #f59e0b 0%, #d97706 100%);
        }
        .nav-card {
            transition: all 0.2s ease;
            border: 2px solid #e2e8f0;
            cursor: pointer;
            background-color: #ffffff;
            position: relative;
            z-index: 50;
        }
        .nav-card:hover {
            transform: translateY(-3px);
            border-color: #93c5fd;
            box-shadow: 0 10px 20px -5px rgba(30, 58, 138, 0.15);
        }
        .nav-card.active-card {
            border-color: #1d4ed8 !important;
            background-color: #eff6ff !important;
            box-shadow: 0 6px 16px rgba(29, 78, 216, 0.22) !important;
        }
        .nav-card.active-card .icon-box {
            background-color: #1d4ed8 !important;
            color: #ffffff !important;
        }
        .nav-card.active-card .nav-title {
            color: #1e3a8a !important;
            font-weight: 800 !important;
        }
        .input-box:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .preset-btn, .dict-filter-btn, .policy-filter-btn {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .preset-btn.active, .dict-filter-btn.active, .policy-filter-btn.active {
            background-color: #1e3a8a !important;
            color: #ffffff !important;
            border-color: #1e3a8a !important;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>

    <!-- [핵심] 최상단 독립 탭 전환 함수 (어떠한 간섭 없이 즉시 DOM 전환) -->
    <script>
        var currentStep = 0;

        function goStep(stepIndex) {
            currentStep = stepIndex;

            for (var i = 0; i < 6; i++) {
                var sectionEl = document.getElementById('step-panel-' + i);
                var cardEl = document.getElementById('step-card-' + i);
                var floatBtn = document.getElementById('float-btn-' + i);

                if (sectionEl) {
                    sectionEl.style.display = (i === stepIndex) ? 'block' : 'none';
                }
                if (cardEl) {
                    if (i === stepIndex) {
                        cardEl.classList.add('active-card');
                    } else {
                        cardEl.classList.remove('active-card');
                    }
                }
                if (floatBtn) {
                    if (i === stepIndex) {
                        floatBtn.className = 'px-2.5 py-1.5 rounded-lg text-xs font-extrabold bg-blue-600 text-white shadow cursor-pointer';
                    } else {
                        floatBtn.className = 'px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 cursor-pointer';
                    }
                }
            }

            // 탭 전환 직후 각 탭의 계산 및 차트 갱신
            setTimeout(function() {
                try {
                    if (stepIndex === 0 && typeof calculateHealth === 'function') calculateHealth();
                    if (stepIndex === 1 && typeof calculateStress === 'function') calculateStress();
                    if (stepIndex === 2 && typeof calculateBEP === 'function') calculateBEP();
                    if (stepIndex === 3 && typeof calculateTax === 'function') calculateTax();
                    if (stepIndex === 4 && typeof renderDictionary === 'function') renderDictionary();
                    if (stepIndex === 5 && typeof renderPolicies === 'function') renderPolicies();
                } catch (err) {
                    console.error(err);
                }
            }, 20);
        }
    </script>
</head>
<body class="min-h-screen flex flex-col justify-between pb-16">

    <!-- 우측 하단 고정 퀵 리모컨 (언제 어디서든 STEP 01~06 즉시 이동 보장) -->
    <div class="fixed bottom-4 right-4 z-50 bg-slate-900/95 backdrop-blur border border-slate-700 p-2 rounded-2xl shadow-2xl flex items-center gap-1.5">
        <span class="text-[11px] font-bold text-amber-400 px-2 hidden sm:inline"><i class="fa-solid fa-bolt mr-1"></i>빠른 탭 이동:</span>
        <button type="button" id="float-btn-0" onclick="goStep(0)" class="px-2.5 py-1.5 rounded-lg text-xs font-extrabold bg-blue-600 text-white shadow cursor-pointer">01.재무진단</button>
        <button type="button" id="float-btn-1" onclick="goStep(1)" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 cursor-pointer">02.위기관리</button>
        <button type="button" id="float-btn-2" onclick="goStep(2)" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 cursor-pointer">03.자산배분</button>
        <button type="button" id="float-btn-3" onclick="goStep(3)" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 cursor-pointer">04.절세설계</button>
        <button type="button" id="float-btn-4" onclick="goStep(4)" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 cursor-pointer">05.금융백과</button>
        <button type="button" id="float-btn-5"
